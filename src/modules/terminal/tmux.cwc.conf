# Config del servidor tmux DEDICADO de Claude Web Console (socket -L cwc).
# Solo se lee al iniciar el servidor tmux de este socket aislado; no afecta
# tu tmux/screen personal ni tu ~/.tmux.conf.

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc,xterm*:Tc"   # truecolor passthrough
set -as terminal-features ",xterm*:clipboard"  # habilita OSC52 (Ms) hacia el navegador
set -g set-clipboard on         # copiar en tmux -> portapapeles del sistema (vía OSC52)
set -g history-limit 10000
set -g mouse on                # rueda -> scroll en copy-mode; arrastrar -> seleccionar+copiar
set -g status off             # sin barra de estado: el navegador es la UI
set -g escape-time 10         # ESC responsivo (crítico para vim/claude)
set -g destroy-unattached off # la sesión sobrevive si el navegador se desconecta
