<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <script>window.__CWC_BUILD__='__BUILD_ID__';</script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <title>Claude Web Console</title>
  <link rel="stylesheet" href="/vendor/xterm/css/xterm.css" />
  <link rel="stylesheet" href="/vendor/hljs/theme.css" />
  <link rel="icon" type="image/png" href="/img/mordor-iso.png" />
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/ui.css" />
  <link rel="stylesheet" href="/css/style.css" />
  <!-- xterm.js y addons (UMD, servidos localmente desde node_modules) -->
  <script src="/vendor/xterm/lib/xterm.js"></script>
  <script src="/vendor/addon-fit/lib/addon-fit.js"></script>
  <script src="/vendor/addon-web-links/lib/addon-web-links.js"></script>
  <script src="/vendor/addon-clipboard/lib/addon-clipboard.js"></script>
  <!-- highlight.js (bundle IIFE local -> window.hljs) -->
  <script src="/vendor/hljs/hljs.min.js"></script>
  <!-- marked (UMD directo desde node_modules -> window.marked) para el markdown del chat -->
  <script src="/vendor/marked/marked.umd.js"></script>
  <!-- Chart.js (UMD local -> window.Chart) para las gráficas de tendencia del modal Uso -->
  <script src="/vendor/chartjs/chart.umd.js"></script>
  <script type="module">
    // Mermaid (3.7MB) se carga LAZY: solo cuando aparece el primer bloque
    // ```mermaid``` real (ui/markdown.js llama window.__loadMermaid()). Antes
    // se importaba en CADA carga de página aunque la sesión no viera ningún
    // diagrama (PEND-621). Memoizado: la 1ra detección dispara el import, el
    // resto reusa la misma promesa.
    window.__loadMermaid = () => {
      if (window.mermaidReady) return window.mermaidReady;
      window.mermaidReady = import('/vendor/mermaid/mermaid.esm.min.mjs').then(({ default: mermaid }) => {
        const css = getComputedStyle(document.documentElement);
        const v = (name) => css.getPropertyValue(name).trim();
        // Mermaid pasa cada color por khroma (lighten/darken/invert): NO acepta
        // color-mix() ni var(). Resolvemos los tokens a HEX en JS. Esto NO viola
        // "cero hex fuera de tokens.css": los hex se DERIVAN de los tokens en runtime.
        const hex = (name, fb) => {
          const c = v(name);
          return /^#([0-9a-f]{3}|[0-9a-f]{6}|[0-9a-f]{8})$/i.test(c) ? c : (fb || '#888888');
        };
        const toRgb = (h) => {
          let s = h.replace('#', '');
          if (s.length === 3) s = s.split('').map((c) => c + c).join('');
          return [parseInt(s.slice(0, 2), 16), parseInt(s.slice(2, 4), 16), parseInt(s.slice(4, 6), 16)];
        };
        const toHex = (rgb) => '#' + rgb.map((n) => Math.max(0, Math.min(255, Math.round(n))).toString(16).padStart(2, '0')).join('');
        // mix(a, b, t): t de `a` sobre `b` (t=0.2 => 20% de a).
        const mix = (a, b, t) => {
          const A = toRgb(a), B = toRgb(b);
          return toHex([0, 1, 2].map((i) => A[i] * t + B[i] * (1 - t)));
        };

        const SURF = hex('--cwc-bg-panel');        // superficie de la lámina del diagrama
        const CHIP = hex('--cwc-bg-chip');
        const TXT  = hex('--cwc-text');
        const TXT2 = hex('--cwc-text-secondary');
        const DIM  = hex('--cwc-text-dim');
        const BORD = hex('--cwc-border');
        const BORS = hex('--cwc-border-strong');

        // Rol semántico -> color de acento. El relleno es ese color al 18% sobre la
        // superficie: tiñe sin gritar y mantiene el texto legible en tema oscuro.
        const ROLE_HUES = {
          key:   hex('--cwc-accent'),
          ok:    hex('--cwc-ok'),
          warn:  hex('--cwc-warn'),
          bad:   hex('--cwc-danger'),
          info:  hex('--cwc-info'),
          cool:  hex('--cwc-accent-cool'),
          deep:  hex('--cwc-model-opus'),
          muted: hex('--cwc-text-dimmer'),
        };
        const ROLES = {};
        for (const [k, hue] of Object.entries(ROLE_HUES)) {
          ROLES[k] = {
            fill: mix(hue, SURF, k === 'muted' ? 0.10 : 0.18),
            stroke: k === 'muted' ? BORS : hue,
            color: k === 'muted' ? DIM : TXT,
          };
        }
        // La comparte ui/markdown.js para inyectar los classDef del preludio:
        // Mermaid necesita colores sólidos, pero el source visible queda intacto.
        window.__cwcMermaidPalette = { roles: ROLES, surface: SURF, text: TXT, line: mix(DIM, SURF, 0.85) };

        const SCALE_HUES = [
          ROLE_HUES.key, ROLE_HUES.cool, ROLE_HUES.warn, ROLE_HUES.ok,
          ROLE_HUES.deep, ROLE_HUES.info, ROLE_HUES.bad, hex('--cwc-cat-archive'),
          hex('--cwc-cat-image'), hex('--cwc-model-codex'), hex('--cwc-cat-code'), hex('--cwc-cat-video'),
        ];
        const scaleVars = {};
        SCALE_HUES.forEach((hue, i) => {
          scaleVars['cScale' + i] = mix(hue, SURF, 0.20);
          scaleVars['cScalePeer' + i] = hue;
          scaleVars['cScaleLabel' + i] = TXT;
          scaleVars['pie' + (i + 1)] = mix(hue, SURF, 0.55);
        });

        const roleCss = Object.entries(ROLES).map(([k, r]) => `
          .${k} > rect, .${k} > polygon, .${k} > circle, .${k} > ellipse, .${k} > path,
          .${k} .basic.label-container, .${k} .node-bkg {
            fill: ${r.fill} !important; stroke: ${r.stroke} !important; stroke-width: 1.5px !important;
          }
          .${k} .nodeLabel, .${k} .label text, .${k} text.text, .${k} span.nodeLabel {
            fill: ${r.color} !important; color: ${r.color} !important;
          }`).join('\n');

        // Mindmap: `look:'neo'` no aplica las cScale*, pero SÍ marca cada rama con su
        // clase `section-N` (medido en el DOM). Cada rama toma su color de la escala:
        // el autor no escribe nada — y `:::` NO existe en mindmap, así que esta es la
        // única vía de color.
        const mindCss = SCALE_HUES.map((_, i) => {
          // Rotado en 1: `SCALE_HUES[0]` es el acento y la RAÍZ ya lo usa — sin esta
          // rotación la primera rama sale del mismo color que el centro. El `pie` sigue
          // usando la escala sin rotar, para no desalinearse de los gráficos ```chart```.
          const hue = SCALE_HUES[(i + 1) % SCALE_HUES.length];
          return `
          .mindmap-node.section-${i} > path, .mindmap-node.section-${i} > rect {
            fill: ${mix(hue, SURF, 0.20)} !important; stroke: ${mix(hue, SURF, 0.75)} !important;
          }
          .mindmap-node.section-${i} > line { stroke: ${mix(hue, SURF, 0.75)} !important; }`;
        }).join('\n');

        const themeCSS = `
          ${roleCss}
          ${mindCss}
          /* Profundidad: los nodos se despegan de la lámina sin marcarse de más. */
          .node rect, .node polygon, .node circle, .node ellipse, .node path,
          .mindmap-node > rect, .mindmap-node > circle, .mindmap-node > polygon {
            filter: drop-shadow(0 2px 3px ${hex('--cwc-bg')}cc);
          }
          .node rect, .node polygon { rx: 8px; ry: 8px; }
          /* Los subgraph se leen como SECCIONES: caja tenue y título en versalita. */
          .cluster rect { rx: 12px; ry: 12px; stroke-dasharray: none; }
          .cluster .cluster-label text, .cluster-label .nodeLabel, .cluster span.nodeLabel {
            fill: ${TXT2} !important; color: ${TXT2} !important;
            font-weight: 600; letter-spacing: .04em; text-transform: uppercase; font-size: .82em;
          }
          /* Etiquetas de arista como PÍLDORA. La píldora va en el <p> NO VACÍO: los
             contenedores existen igual para las aristas SIN etiqueta y quedaban
             dibujados como una pastilla suelta en la esquina del diagrama. */
          .edgeLabel .label span, .edgeLabel foreignObject div {
            background: transparent !important; border: 0 !important; padding: 0 !important;
          }
          .edgeLabel p:not(:empty) {
            background: ${mix(CHIP, SURF, 0.7)} !important; color: ${TXT2} !important;
            border: 1px solid ${mix(BORD, SURF, 0.9)}; border-radius: 999px;
            padding: 1px 7px; font-size: .84em; line-height: 1.5;
          }
          .flowchart-link, .edgePath .path { stroke-width: 1.4px; }
          .marker { fill: ${mix(DIM, SURF, 0.85)}; stroke: ${mix(DIM, SURF, 0.85)}; }
          /* Mindmap: la raíz manda visualmente. */
          .mindmap-node.section-root > circle, .mindmap-node.section-root > rect,
          .mindmap-node.section-root > path {
            fill: ${mix(ROLE_HUES.key, SURF, 0.20)} !important;
            stroke: ${ROLE_HUES.key} !important; stroke-width: 2px !important;
          }
        `;

        const cfg = {
          // suppressErrorRendering: sin esto, al fallar el parseo Mermaid dibuja su
          // "bomba" de error en el div temporal que cuelga de <body> y tira la excepción
          // ANTES de limpiarlo -> queda huérfana al final de la página (una por cada
          // diagrama fallido). Con el flag en true, Mermaid limpia y solo tira el error;
          // el aviso al usuario lo pone markdown.js (.md-mermaid-error).
          suppressErrorRendering: true,
          startOnLoad: false,
          securityLevel: 'strict',
          theme: 'base',
          themeCSS,
          fontFamily: v('--cwc-font-ui'),
          fontSize: 15,
          maxTextSize: 90000,
          flowchart: {
            useMaxWidth: false,
            htmlLabels: true,
            curve: 'basis',
            padding: 14,
            nodeSpacing: 52,
            rankSpacing: 60,
            diagramPadding: 10,
          },
          mindmap: { useMaxWidth: false, padding: 14 },
          sequence: { useMaxWidth: false, diagramMarginX: 12, diagramMarginY: 12 },
          er: { useMaxWidth: false },
          gantt: { useMaxWidth: false },
          class: { useMaxWidth: false },
          state: { useMaxWidth: false },
          journey: { useMaxWidth: false },
          pie: { useMaxWidth: false },
          themeVariables: {
            background: SURF,
            // Con `look:'neo'`, primaryBorderColor llega vía gradiente a TODOS los
            // bordes. El acento se reserva para `:::key`; sin clase, el nodo es neutro.
            primaryColor: mix(CHIP, SURF, 0.85),
            primaryBorderColor: BORS,
            primaryTextColor: TXT,
            secondaryColor: mix(ROLE_HUES.cool, SURF, 0.16),
            secondaryBorderColor: mix(ROLE_HUES.cool, SURF, 0.55),
            secondaryTextColor: TXT,
            tertiaryColor: mix(ROLE_HUES.deep, SURF, 0.14),
            tertiaryBorderColor: mix(ROLE_HUES.deep, SURF, 0.5),
            tertiaryTextColor: TXT,
            mainBkg: mix(CHIP, SURF, 0.85),
            nodeBorder: BORS,
            nodeTextColor: TXT,
            textColor: TXT,
            titleColor: TXT,
            lineColor: mix(DIM, SURF, 0.85),
            defaultLinkColor: mix(DIM, SURF, 0.85),
            clusterBkg: mix(CHIP, SURF, 0.35),
            clusterBorder: mix(BORD, SURF, 0.9),
            edgeLabelBackground: mix(CHIP, SURF, 0.7),
            labelBoxBkgColor: mix(CHIP, SURF, 0.7),
            labelBoxBorderColor: BORS,
            labelTextColor: TXT,
            activationBkgColor: mix(ROLE_HUES.key, SURF, 0.22),
            activationBorderColor: ROLE_HUES.key,
            noteBkgColor: mix(ROLE_HUES.warn, SURF, 0.12),
            noteBorderColor: mix(ROLE_HUES.warn, SURF, 0.5),
            noteTextColor: TXT,
            actorBkg: mix(ROLE_HUES.cool, SURF, 0.16),
            actorBorder: mix(ROLE_HUES.cool, SURF, 0.6),
            actorTextColor: TXT,
            actorLineColor: mix(DIM, SURF, 0.7),
            signalColor: mix(DIM, SURF, 0.9),
            signalTextColor: TXT2,
            sequenceNumberColor: hex('--cwc-accent-ink'),
            altBackground: mix(CHIP, SURF, 0.4),
            errorBkgColor: mix(ROLE_HUES.bad, SURF, 0.25),
            errorTextColor: TXT,
            fontFamily: v('--cwc-font-ui'),
            fontSize: '15px',
            ...scaleVars,
          },
        };
        try {
          mermaid.initialize({ ...cfg, look: 'neo' });
        } catch {
          console.warn('mermaid: look "neo" no soportado, usando classic');
          mermaid.initialize(cfg);
        }
        window.mermaid = mermaid;
        return mermaid;
      }).catch((err) => {
        console.error('mermaid: no se pudo cargar el vendor', err);
        return null;
      });
      return window.mermaidReady;
    };
  </script>
</head>
<body>
  <!-- Splash de arranque: cubre desde el primer paint hasta que main.js
       termina el boot (window.__bootHide). El markup del Pac-Man espeja
       ui/pacman.js (acá tiene que ser HTML estático: existe ANTES de que
       cargue cualquier módulo JS); las clases vienen de ui.css, garantizado
       al primer paint porque los <link> de CSS son render-blocking. -->
  <div id="boot-splash">
    <img id="boot-logo" src="/img/mordor-logo.png" alt="Mordor Staffing" />
    <span id="boot-sub">Consola interna</span>
    <span class="cwc-pacman is-working"><span class="pac-man"></span><span class="pac-track"><i class="pac-dot"></i><i class="pac-dot"></i><i class="pac-dot"></i></span></span>
    <div id="boot-bar"><span id="boot-bar-fill"></span></div>
    <div class="boot-line"><span id="boot-pct">10%</span><span id="boot-msg">cargando…</span></div>
  </div>
  <script>
    // Red de seguridad SIN módulos (corre aunque main.js nunca cargue):
    // __bootHide desmonta el splash con fade; a los 8 s avisa que algo tarda
    // y a los 12 s lo fuerza para no dejar un Pac-Man eterno tapando errores.
    // __bootPct: barra de progreso por HITOS REALES del boot (no un timer) —
    // 10 HTML+CSS pintados · 15 vendors JS · 35 módulos montados ·
    // 60 sesiones listadas · 80 esperando historial del chat · 100 listo.
    window.__bootPct = (p) => {
      const f = document.getElementById('boot-bar-fill');
      const t = document.getElementById('boot-pct');
      if (f) f.style.width = `${p}%`;
      if (t) t.textContent = `${p}%`;
    };
    window.__bootHide = () => {
      const s = document.getElementById('boot-splash');
      if (!s) return;
      window.__bootPct(100);
      s.classList.add('done');
      setTimeout(() => s.remove(), 300);
    };
    // Este script corre cuando los vendors síncronos del <head> ya bajaron.
    window.__bootPct(15);
    setTimeout(() => {
      const s = document.getElementById('boot-splash');
      const m = document.getElementById('boot-msg');
      if (s && m) m.textContent = 'esto está tardando más de lo normal…';
    }, 8000);
    setTimeout(() => window.__bootHide(), 12000);
  </script>
  <div id="app">
    <div id="body">
      <!-- Panel izquierdo: organizado por INTENCIÓN (empezar / retomar / estado).
           Colapsable a un rail angosto (persistido en localStorage). En móvil se
           comporta como overlay (se oculta con .hidden).
           Cada slot [data-module] lo llena su módulo (ver docs/frontend-modules.md). -->
      <!-- Panel IZQUIERDO: control y módulos (Tickets & Features · Pendientes ·
           Comunicaciones) + pie de estado (CPU/RAM/disco · cuenta · sistema).
           Las Sesiones y "Nueva sesión" viven ahora en la barra DERECHA. -->
      <aside id="sidebar" class="side-panel">
        <!-- Cabecera del panel: ☰ (contraer/expandir a rail) + chip del usuario
             conectado (se movió acá desde .footer-acct en 2026-07-31, pedido de
             Niko: abajo quedaba espachurrado entre el botón de tokens y los
             íconos, y esta fila estaba vacía). En el rail colapsado queda solo
             el avatar (el nombre es .only-expanded). -->
        <div class="sb-head">
          <button id="toggle-sidebar" class="rail-btn" data-icon="menu" title="Contraer/expandir panel"></button>
          <div id="acct-chip" class="acct-chip" title="Usuario conectado" data-i18n-title="core.acctUser">
            <span id="acct-avatar" class="acct-avatar" aria-hidden="true"></span>
            <span id="acct-user" class="acct-name only-expanded"></span>
          </div>
        </div>

        <div class="sidebar-scroll only-expanded">
          <!-- Tickets & Features (2026-07-07): dashboard One Front Door
               determinístico (Zoho/GitHub directo vía MCP, sin IA en la
               lectura). Reemplazó a "Bugs & Features" v1 (archivado en
               _archived/). Ver plan en ~/pool of documents/. -->
          <section class="side-sec" data-module="tickets"></section>
          <!-- Pendientes: tablero PRIVADO de tareas (manual + audio adentro) -->
          <section class="side-sec" data-module="tasks"></section>
          <section class="side-sec" data-module="visado"></section>
          <!-- Mejora Continua (ROAD-256): lecciones de PROCESO destiladas al cerrar chats -->
          <section class="side-sec" data-module="retro"></section>
        </div>

        <!-- Ver estado: pie fijo compacto (gauges y tokens visibles también
             en el rail colapsado, en versión compacta) -->
        <footer class="sidebar-footer">
          <div data-module="plan-limits" class="only-expanded"></div>
          <div class="footer-acct">
            <span data-module="usage"></span>
            <a href="/archivos" class="btn-ghost btn--sm btn--icon" data-icon="folder" title="Explorador" data-i18n-title="core.explorer"></a>
            <a href="/raw" target="_blank" rel="noopener" class="btn-ghost btn--sm btn--icon" data-icon="pulse" title="Vista Raw" data-i18n-title="core.rawView"></a>
            <!-- 🧠 Cerebro del Pad: vista contemplativa del banco de conocimientos
                 (grafo del Pad local) que se ilumina con cada uso real. Nace
                 `hidden` y solo lo destapa main.js si el usuario tiene `oversight`
                 (recorte de experiencia; el gate real está en /api/cerebro/*). -->
            <a href="/cerebro.html" target="_blank" rel="noopener" id="cerebro-link" hidden class="btn-ghost btn--sm btn--icon" data-icon="brain" title="Cerebro del Pad" data-i18n-title="core.cerebroView"></a>
            <a href="/seguimientos" target="_blank" rel="noopener" class="btn-ghost btn--sm btn--icon" data-icon="list" title="Seguimientos" data-i18n-title="core.followUps"></a>
            <button id="help-index-btn" class="btn-ghost btn--sm btn--icon" data-icon="help" title="Guía de la consola" data-i18n-title="core.help.indexTitle"></button>
            <span data-module="system"></span>
          </div>
        </footer>
      </aside>

      <!-- Velo de fondo del panel lateral IZQUIERDO en móvil (overlay): lo
           atenúa y permite cerrarlo con un tap afuera. Invisible en
           desktop (CSS, ver "Móvil" en style.css). -->
      <div id="sidebar-scrim"></div>

      <!-- Panel central: terminales -->
      <main id="terminals"></main>

      <!-- Panel DERECHO: Sesiones + "Nueva sesión". Colapsable a rail con su
           propio ☰; en móvil es un drawer que entra desde la derecha (su
           scrim va DESPUÉS para el selector hermano `~`). El pie muestra el
           pulso de Tolkien persistente (leyenda, no acordeón). -->
      <aside id="sidebar-right" class="side-panel">
        <!-- Cabecera: ☰ (contraer/expandir) + "Nueva sesión" al lado, ambos
             con la misma altura/diseño (rail-btn). Colapsado: ☰ + "+". -->
        <div class="sb-head sb-head--right">
          <button id="toggle-sidebar-right" class="rail-btn" data-icon="menu" title="Contraer/expandir sesiones"></button>
          <button id="rail-new" class="rail-btn sb-new only-collapsed" data-icon="plus" title="Nueva sesión"></button>
          <!-- Empezar trabajo: LA acción prominente (solo panel expandido) -->
          <div class="sidebar-top only-expanded" data-module="launcher"></div>
        </div>

        <!-- Pestañas abiertas (pty | chat): navegación principal. Iconos en el
             rail colapsado; ocultas en expandido (redundante con Sesiones). -->
        <div id="rail-tabs"></div>

        <div class="sidebar-scroll only-expanded">
          <!-- Retomar trabajo: sesiones (siempre visible, sin acordeón) -->
          <section class="side-sec" data-module="sessions"></section>
        </div>

        <!-- Pie derecho: pulso de Tolkien PERSISTENTE (branch · ↓N por traer ·
             actualizar) + leyenda CPU/RAM/disco DEBAJO. Ambos siempre visibles,
             sin colapsar (Tolkien se oculta solo en el rail angosto). -->
        <footer class="sidebar-footer sidebar-footer--right">
          <div class="tk-persist only-expanded" data-module="tolkien"></div>
          <div data-module="stats"></div>
        </footer>
      </aside>

      <!-- Velo de fondo del panel DERECHO en móvil (overlay desde la derecha):
           va DESPUÉS de #sidebar-right para el selector hermano `~`. -->
      <div id="sidebar-right-scrim"></div>

      <!-- Asas flotantes (solo móvil): abren los drawers. Ubicadas sobre el
           composer para estorbar menos (pedido del usuario): la IZQUIERDA abre
           módulos (Tickets/Pendientes/Comunicaciones), la DERECHA Sesiones. -->
      <button id="sidebar-handle" data-icon="menu" title="Módulos: Tickets · Pendientes · Comunicaciones"></button>
      <button id="sidebar-right-handle" data-icon="sparkle" title="Sesiones / Nueva sesión"></button>
    </div>

    <!-- Barra de teclas auxiliares + dictado (móvil; fija sobre el teclado). -->
    <div id="auxbar" class="collapsed">
      <button id="aux-handle" data-icon="keyboard" title="Teclas / dictado"></button>
      <div id="aux-content">
      <div id="dictation" hidden>
        <input id="dictation-input" type="text" enterkeyhint="send"
               placeholder="Dictar / escribir y enviar…"
               autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" />
        <button id="dictation-enter" class="aux-key toggle active" title="Agregar Enter al enviar">⏎</button>
        <button id="dictation-send" class="aux-send" data-i18n="core.dictateSend">Enviar</button>
      </div>
      <div id="auxkeys">
        <button id="aux-menu" class="aux-key" data-icon="menu" title="Abrir panel lateral"></button>
        <button id="aux-help" class="aux-key" data-icon="help" data-help="auxbar" title="Ayuda de la barra" data-i18n-title="core.help.btnTitle"></button>
        <button class="aux-key" data-seq="esc">Esc</button>
        <button class="aux-key" data-seq="tab">Tab</button>
        <button class="aux-key" data-seq="shifttab">⇧Tab</button>
        <button id="aux-ctrl" class="aux-key">Ctrl</button>
        <button class="aux-key" data-seq="up">↑</button>
        <button class="aux-key" data-seq="down">↓</button>
        <button class="aux-key" data-seq="left">←</button>
        <button class="aux-key" data-seq="right">→</button>
        <button class="aux-key" data-seq="ctrlc">^C</button>
        <button id="aux-slash" class="aux-key" title="Comando slash (autocompletado en el chat)">/</button>
        <button id="aux-paste" class="aux-key" data-icon="clipboard" title="Pegar del portapapeles"></button>
        <button id="aux-dictate" class="aux-key toggle" title="Modo dictado / texto">abc</button>
      </div>
      </div>
    </div>
  </div>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
