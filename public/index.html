<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <script>window.__CWC_BUILD__='__BUILD_ID__';</script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <title>Claude Web Console</title>
  <link rel="stylesheet" href="/vendor/xterm/css/xterm.css" />
  <link rel="stylesheet" href="/vendor/hljs/theme.css" />
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/ui.css" />
  <link rel="stylesheet" href="/css/style.css" />
  <!-- xterm.js y addons (UMD, servidos localmente desde node_modules) -->
  <script src="/vendor/xterm/lib/xterm.js"></script>
  <script src="/vendor/addon-fit/lib/addon-fit.js"></script>
  <script src="/vendor/addon-web-links/lib/addon-web-links.js"></script>
  <script src="/vendor/addon-clipboard/lib/addon-clipboard.js"></script>
  <!-- highlight.js (bundle IIFE local -> window.hljs) -->
  <script src="/vendor/hljs/hljs.min.js"></script>
  <!-- marked (bundle IIFE local -> window.marked) para el markdown del chat -->
  <script src="/vendor/marked/marked.min.js"></script>
  <!-- Chart.js (UMD local -> window.Chart) para las gráficas de tendencia del modal Uso -->
  <script src="/vendor/chartjs/chart.umd.js"></script>
  <script type="module">
    // Mermaid (3.7MB) se carga LAZY: solo cuando aparece el primer bloque
    // ```mermaid``` real (ui/markdown.js llama window.__loadMermaid()). Antes
    // se importaba en CADA carga de página aunque la sesión no viera ningún
    // diagrama (PEND-621). Memoizado: la 1ra detección dispara el import, el
    // resto reusa la misma promesa.
    window.__loadMermaid = () => {
      if (window.mermaidReady) return window.mermaidReady;
      window.mermaidReady = import('/vendor/mermaid/mermaid.esm.min.mjs').then(({ default: mermaid }) => {
        const css = getComputedStyle(document.documentElement);
        const v = (name) => css.getPropertyValue(name).trim();
        mermaid.initialize({
          startOnLoad: false,
          securityLevel: 'strict',
          theme: 'base',
          themeVariables: {
            background: v('--cwc-bg-elevated'),
            primaryColor: v('--cwc-accent-bg'),
            primaryTextColor: v('--cwc-text'),
            primaryBorderColor: v('--cwc-accent'),
            lineColor: v('--cwc-text-dim'),
            secondaryColor: v('--cwc-bg-chip'),
            tertiaryColor: v('--cwc-bg-hover'),
            textColor: v('--cwc-text'),
            fontFamily: v('--cwc-font-ui'),
            nodeBorder: v('--cwc-border-strong'),
            clusterBkg: v('--cwc-bg-panel'),
            clusterBorder: v('--cwc-border'),
            edgeLabelBackground: v('--cwc-bg-elevated'),
            errorBkgColor: v('--cwc-danger'),
            errorTextColor: v('--cwc-text'),
          },
        });
        window.mermaid = mermaid;
        return mermaid;
      }).catch((err) => {
        console.error('mermaid: no se pudo cargar el vendor', err);
        return null;
      });
      return window.mermaidReady;
    };
  </script>
</head>
<body>
  <!-- Splash de arranque: cubre desde el primer paint hasta que main.js
       termina el boot (window.__bootHide). El markup del Pac-Man espeja
       ui/pacman.js (acá tiene que ser HTML estático: existe ANTES de que
       cargue cualquier módulo JS); las clases vienen de ui.css, garantizado
       al primer paint porque los <link> de CSS son render-blocking. -->
  <div id="boot-splash">
    <span class="cwc-pacman is-working"><span class="pac-man"></span><span class="pac-track"><i class="pac-dot"></i><i class="pac-dot"></i><i class="pac-dot"></i></span></span>
    <div id="boot-bar"><span id="boot-bar-fill"></span></div>
    <div class="boot-line"><span id="boot-pct">10%</span><span id="boot-msg">cargando…</span></div>
  </div>
  <script>
    // Red de seguridad SIN módulos (corre aunque main.js nunca cargue):
    // __bootHide desmonta el splash con fade; a los 8 s avisa que algo tarda
    // y a los 12 s lo fuerza para no dejar un Pac-Man eterno tapando errores.
    // __bootPct: barra de progreso por HITOS REALES del boot (no un timer) —
    // 10 HTML+CSS pintados · 15 vendors JS · 35 módulos montados ·
    // 60 sesiones listadas · 80 esperando historial del chat · 100 listo.
    window.__bootPct = (p) => {
      const f = document.getElementById('boot-bar-fill');
      const t = document.getElementById('boot-pct');
      if (f) f.style.width = `${p}%`;
      if (t) t.textContent = `${p}%`;
    };
    window.__bootHide = () => {
      const s = document.getElementById('boot-splash');
      if (!s) return;
      window.__bootPct(100);
      s.classList.add('done');
      setTimeout(() => s.remove(), 300);
    };
    // Este script corre cuando los vendors síncronos del <head> ya bajaron.
    window.__bootPct(15);
    setTimeout(() => {
      const s = document.getElementById('boot-splash');
      const m = document.getElementById('boot-msg');
      if (s && m) m.textContent = 'esto está tardando más de lo normal…';
    }, 8000);
    setTimeout(() => window.__bootHide(), 12000);
  </script>
  <div id="app">
    <div id="body">
      <!-- Panel izquierdo: organizado por INTENCIÓN (empezar / retomar / estado).
           Colapsable a un rail angosto (persistido en localStorage). En móvil se
           comporta como overlay (se oculta con .hidden).
           Cada slot [data-module] lo llena su módulo (ver docs/frontend-modules.md). -->
      <!-- Panel IZQUIERDO: control y módulos (Tickets & Features · Pendientes ·
           Comunicaciones) + pie de estado (CPU/RAM/disco · cuenta · sistema).
           Las Sesiones y "Nueva sesión" viven ahora en la barra DERECHA. -->
      <aside id="sidebar" class="side-panel">
        <!-- Cabecera del panel: solo ☰ (contraer/expandir a rail). -->
        <div class="sb-head">
          <button id="toggle-sidebar" class="rail-btn" data-icon="menu" title="Contraer/expandir panel"></button>
        </div>

        <div class="sidebar-scroll only-expanded">
          <!-- Tickets & Features (2026-07-07): dashboard One Front Door
               determinístico (Zoho/GitHub directo vía MCP, sin IA en la
               lectura). Reemplazó a "Bugs & Features" v1 (archivado en
               _archived/). Ver plan en ~/pool of documents/. -->
          <section class="side-sec" data-module="tickets"></section>
          <!-- Pendientes: tablero PRIVADO de tareas (manual + audio adentro) -->
          <section class="side-sec" data-module="tasks"></section>
          <!-- Mejora Continua (ROAD-256): lecciones de PROCESO destiladas al cerrar chats -->
          <section class="side-sec" data-module="retro"></section>
        </div>

        <!-- Ver estado: pie fijo compacto (gauges y tokens visibles también
             en el rail colapsado, en versión compacta) -->
        <footer class="sidebar-footer">
          <div data-module="plan-limits" class="only-expanded"></div>
          <div class="footer-acct">
            <span data-module="usage"></span>
            <span id="acct-user" class="acct-user only-expanded"></span>
            <a href="/archivos" class="btn-ghost btn--sm btn--icon" data-icon="folder" title="Explorador" data-i18n-title="core.explorer"></a>
            <a href="/raw" target="_blank" rel="noopener" class="btn-ghost btn--sm btn--icon" data-icon="pulse" title="Vista Raw" data-i18n-title="core.rawView"></a>
            <a href="/seguimientos" target="_blank" rel="noopener" class="btn-ghost btn--sm btn--icon" data-icon="list" title="Seguimientos" data-i18n-title="core.followUps"></a>
            <span data-module="system"></span>
          </div>
        </footer>
      </aside>

      <!-- Velo de fondo del panel lateral IZQUIERDO en móvil (overlay): lo
           atenúa y permite cerrarlo con un tap afuera. Invisible en
           desktop (CSS, ver "Móvil" en style.css). -->
      <div id="sidebar-scrim"></div>

      <!-- Panel central: terminales -->
      <main id="terminals"></main>

      <!-- Panel DERECHO: Sesiones + "Nueva sesión". Colapsable a rail con su
           propio ☰; en móvil es un drawer que entra desde la derecha (su
           scrim va DESPUÉS para el selector hermano `~`). El pie muestra el
           pulso de Tolkien persistente (leyenda, no acordeón). -->
      <aside id="sidebar-right" class="side-panel">
        <!-- Cabecera: ☰ (contraer/expandir) + "Nueva sesión" al lado, ambos
             con la misma altura/diseño (rail-btn). Colapsado: ☰ + "+". -->
        <div class="sb-head sb-head--right">
          <button id="toggle-sidebar-right" class="rail-btn" data-icon="menu" title="Contraer/expandir sesiones"></button>
          <button id="rail-new" class="rail-btn sb-new only-collapsed" data-icon="plus" title="Nueva sesión"></button>
          <!-- Empezar trabajo: LA acción prominente (solo panel expandido) -->
          <div class="sidebar-top only-expanded" data-module="launcher"></div>
        </div>

        <!-- Pestañas abiertas (pty | chat): navegación principal. Iconos en el
             rail colapsado; ocultas en expandido (redundante con Sesiones). -->
        <div id="rail-tabs"></div>

        <div class="sidebar-scroll only-expanded">
          <!-- Retomar trabajo: sesiones (siempre visible, sin acordeón) -->
          <section class="side-sec" data-module="sessions"></section>
        </div>

        <!-- Pie derecho: pulso de Tolkien PERSISTENTE (branch · ↓N por traer ·
             actualizar) + leyenda CPU/RAM/disco DEBAJO. Ambos siempre visibles,
             sin colapsar (Tolkien se oculta solo en el rail angosto). -->
        <footer class="sidebar-footer sidebar-footer--right">
          <div class="tk-persist only-expanded" data-module="tolkien"></div>
          <div data-module="stats"></div>
        </footer>
      </aside>

      <!-- Velo de fondo del panel DERECHO en móvil (overlay desde la derecha):
           va DESPUÉS de #sidebar-right para el selector hermano `~`. -->
      <div id="sidebar-right-scrim"></div>

      <!-- Asas flotantes (solo móvil): abren los drawers. Ubicadas sobre el
           composer para estorbar menos (pedido del usuario): la IZQUIERDA abre
           módulos (Tickets/Pendientes/Comunicaciones), la DERECHA Sesiones. -->
      <button id="sidebar-handle" data-icon="menu" title="Módulos: Tickets · Pendientes · Comunicaciones"></button>
      <button id="sidebar-right-handle" data-icon="sparkle" title="Sesiones / Nueva sesión"></button>
    </div>

    <!-- Barra de teclas auxiliares + dictado (móvil; fija sobre el teclado). -->
    <div id="auxbar" class="collapsed">
      <button id="aux-handle" data-icon="keyboard" title="Teclas / dictado"></button>
      <div id="aux-content">
      <div id="dictation" hidden>
        <input id="dictation-input" type="text" enterkeyhint="send"
               placeholder="Dictar / escribir y enviar…"
               autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" />
        <button id="dictation-enter" class="aux-key toggle active" title="Agregar Enter al enviar">⏎</button>
        <button id="dictation-send" class="aux-send" data-i18n="core.dictateSend">Enviar</button>
      </div>
      <div id="auxkeys">
        <button id="aux-menu" class="aux-key" data-icon="menu" title="Abrir panel lateral"></button>
        <button class="aux-key" data-seq="esc">Esc</button>
        <button class="aux-key" data-seq="tab">Tab</button>
        <button class="aux-key" data-seq="shifttab">⇧Tab</button>
        <button id="aux-ctrl" class="aux-key">Ctrl</button>
        <button class="aux-key" data-seq="up">↑</button>
        <button class="aux-key" data-seq="down">↓</button>
        <button class="aux-key" data-seq="left">←</button>
        <button class="aux-key" data-seq="right">→</button>
        <button class="aux-key" data-seq="ctrlc">^C</button>
        <button id="aux-slash" class="aux-key" title="Comando slash (autocompletado en el chat)">/</button>
        <button id="aux-paste" class="aux-key" data-icon="clipboard" title="Pegar del portapapeles"></button>
        <button id="aux-dictate" class="aux-key toggle" title="Modo dictado / texto">abc</button>
      </div>
      </div>
    </div>
  </div>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
